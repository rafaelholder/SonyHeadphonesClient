name: Build

# rafaelholder fork: trimmed to what this version targets (Windows x64).
# Removed from upstream: GitHub Pages deploy, Web (Emscripten), Android, iOS, macOS, Linux and other
# Windows variants. Actions are pinned by commit SHA (tags are mutable); the comment keeps the tag.
# Upstream workflow: https://github.com/mos9527/SonyHeadphonesClient/blob/v1-compat/.github/workflows/cmake.yml

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: MinSizeRel
  CMAKE_BUILD_PARALLEL_LEVEL: '4'

jobs:
  pre-check:
    name: Check generated files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      # Any clang-format >= 19 formats this tree identically (see DEVELOPER.md); CI pins one for reproducibility.
      # Generated sources are skipped via .clang-format-ignore.
      - name: Check formatting (clang-format)
        run: |
          python -m pip install clang-format==22.1.8
          git ls-files -z '*.c' '*.cpp' '*.h' '*.hpp' '*.mm' | xargs -0 clang-format --dry-run --Werror

      - name: Compare rendered headers with checked-in headers
        run: python -m tooling.ida.j2objc.render --check

      - name: Install codegen dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18-dev libclang-18-dev ninja-build

      - name: Configure codegen
        run: cmake -S . -B build-codegen -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DMDR_BUILD_CLIENT=OFF -DMDR_BUILD_BT=OFF -DMDR_BUILD_TESTING=OFF -DMDR_BUILD_CODEGEN=ON -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm

      - name: Compare codegen output with checked-in generated files
        run: |
          cmake --build build-codegen --target mdr_codegen
          git diff --exit-code -- libmdr/include/mdr/Generated libmdr/src/Generated client/Generated

  build-windows:
    needs: pre-check
    name: Build SonyHeadphonesClient-win-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure CMake
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE -DMDR_BUILD_CODEGEN=OFF

      - name: Build
        run: cmake --build build --config $env:BUILD_TYPE --target SonyHeadphonesClient mdr_tests

      - name: Run ABI and packet replay tests
        run: ctest --test-dir build --build-config $env:BUILD_TYPE --output-on-failure --no-tests=error

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SonyHeadphonesClient-win-x64
          path: build/client/${{ env.BUILD_TYPE }}/SonyHeadphonesClient.exe
          if-no-files-found: error
